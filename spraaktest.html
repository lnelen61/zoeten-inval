<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spraaktest">
<title>Spraaktest</title>
<style>
:root{--paper:#FBFBF8;--ink:#25358C;--soft:#4A58A3;--rule:#E2574C;--line:#C9CDE6;--ok:#2F7D4A;--bad:#C8352B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#131833;--ink:#E8EBFA;--soft:#AEB6DD;--line:#3A4378;--ok:#6CCB8B;--bad:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
h1{font-size:1.5rem;letter-spacing:.05em;margin:0 0 4px}
p{color:var(--soft);line-height:1.45;margin:0 0 14px}
button{font:inherit;cursor:pointer}
#mic{display:block;width:100%;padding:26px 12px;border-radius:12px;border:3px solid var(--ink);background:var(--rule);color:#fff;
  font-weight:900;font-size:1.4rem;letter-spacing:.03em}
#mic.luister{background:var(--ok)}
.box{border:2px solid var(--line);border-radius:10px;padding:12px;margin:14px 0}
.box h2{margin:0 0 6px;font-size:.8rem;letter-spacing:.1em;color:var(--soft)}
.box div{font-size:1.15rem;min-height:1.4em;word-break:break-word}
.ok{color:var(--ok)} .bad{color:var(--bad)}
ul{margin:6px 0 0;padding-left:20px;font-size:1.1rem}
.klein{font-size:.9rem;color:var(--soft)}
.sel{display:flex;gap:8px;margin:0 0 14px}
.sel button{flex:1;padding:10px;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:700}
.sel button.aan{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<h1>SPRAAKTEST</h1>
<p>Tik op de grote knop en zeg bijvoorbeeld: <b>"twee Seef en een cola voor Jan"</b>.</p>

<div class="sel" id="taalKeuze">
  <button data-l="nl-BE" class="aan">Vlaams</button>
  <button data-l="nl-NL">Nederlands</button>
</div>

<button id="mic">Tik en spreek</button>

<div class="box"><h2>WAT IK HOORDE</h2><div id="gehoord">—</div></div>
<div class="box"><h2>HOE IK HET BEGRIJP</h2><div id="begrepen">—</div></div>
<div class="box"><h2>STATUS</h2><div id="status" class="klein">Even controleren…</div></div>

<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let taal = "nl-BE", rec = null, bezig = false;
const standalone = (navigator.standalone === true) || matchMedia("(display-mode: standalone)").matches;

function status(t, cls){ const s = $("status"); s.textContent = t; s.className = "klein " + (cls || ""); }
status((SR ? "Spraakherkenning is beschikbaar in deze browser. " : "GEEN spraakherkenning beschikbaar in deze browser. ") +
       (standalone ? "Je gebruikt dit als tegel op het beginscherm." : "Je gebruikt dit in de gewone browser (Safari/Chrome)."), SR ? "ok" : "bad");

document.querySelectorAll("#taalKeuze button").forEach(b => b.onclick = () => {
  taal = b.dataset.l;
  document.querySelectorAll("#taalKeuze button").forEach(x => x.classList.toggle("aan", x === b));
});

// Nederlandse telwoorden -> getal
const GETAL = {een:1, "één":1, eentje:1, twee:2, drie:3, vier:4, vijf:5, zes:6, zeven:7, acht:8, negen:9, tien:10};

// Zin -> {klant, regels:[[aantal, tekst]]}
function begrijp(zin){
  let t = zin.toLowerCase().replace(/[.!?]/g, " ").replace(/\s+/g, " ").trim();
  let klant = "";
  const m = t.match(/\b(?:voor|op rekening van|rekening van|op)\s+([a-zà-ÿ' -]+)$/);
  if (m){ klant = m[1].trim(); t = t.slice(0, m.index).trim(); }
  const regels = [];
  t.split(/\s+(?:en|plus|ook)\s+|,/).forEach(deel => {
    deel = deel.trim(); if (!deel) return;
    const w = deel.split(" ");
    let n = 1, rest = deel;
    const eerste = w[0];
    if (/^\d+$/.test(eerste)){ n = parseInt(eerste, 10); rest = w.slice(1).join(" "); }
    else if (GETAL[eerste] !== undefined){ n = GETAL[eerste]; rest = w.slice(1).join(" "); }
    if (rest) regels.push([n, rest]);
  });
  return {klant, regels};
}

function toon(zin){
  $("gehoord").textContent = zin || "—";
  const r = begrijp(zin || "");
  if (!r.regels.length && !r.klant){ $("begrepen").textContent = "—"; return; }
  let h = "";
  if (r.regels.length) h += "<ul>" + r.regels.map(([n, x]) => `<li>${n} × ${x.replace(/</g,"&lt;")}</li>`).join("") + "</ul>";
  h += `<div class="klein">Klant: ${r.klant ? r.klant.replace(/</g,"&lt;") : "(niet genoemd)"}</div>`;
  $("begrepen").innerHTML = h;
}

$("mic").onclick = () => {
  if (!SR){ status("Deze browser heeft geen spraakherkenning.", "bad"); return; }
  if (bezig){ try { rec.stop(); } catch(e){} return; }
  rec = new SR();
  rec.lang = taal; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
  rec.onstart = () => { bezig = true; $("mic").textContent = "Ik luister… (tik om te stoppen)"; $("mic").classList.add("luister"); status("Luisteren, taal " + taal + ". Spreek nu."); };
  rec.onresult = e => {
    let tekst = "", eind = false;
    for (let i = e.resultIndex; i < e.results.length; i++){ tekst += e.results[i][0].transcript; if (e.results[i].isFinal) eind = true; }
    toon(tekst); if (eind) status("Klaar. Betrouwbaarheid ± " + Math.round((e.results[e.results.length-1][0].confidence || 0) * 100) + " %", "ok");
  };
  rec.onerror = e => status("Fout: " + e.error + (e.error === "not-allowed" || e.error === "service-not-allowed" ? " (microfoon of spraakherkenning niet toegelaten: controleer Instellingen → Siri en Dicteren / toestemming voor deze pagina)" : ""), "bad");
  rec.onend = () => { bezig = false; $("mic").textContent = "Tik en spreek"; $("mic").classList.remove("luister"); };
  try { rec.start(); } catch(e){ status("Kon niet starten: " + e.message, "bad"); }
};
</script>
</body>
</html>
